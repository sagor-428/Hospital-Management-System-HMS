<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Book Appointment | Hospital Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        body {
            background-color: #f5f7fb;
            font-family: "Segoe UI", sans-serif;
        }

        .page-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }

        .doctor-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
        }

        .slot-btn {
            min-width: 110px;
            border-radius: 10px;
        }

        .slot-btn input {
            display: none;
        }

        .slot-btn label {
            cursor: pointer;
            display: block;
            padding: 12px 15px;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            text-align: center;
            background: white;
        }

        .slot-btn input:checked + label {
            background: #0d6efd;
            color: white;
            border-color: #0d6efd;
        }

    </style>

</head>


<body>

<div class="page-container">


    <!-- HEADER -->

    <div class="mb-4">

        <a th:href="@{/patient/doctors}"
           class="btn btn-outline-secondary mb-3">

            <i class="bi bi-arrow-left me-2"></i>

            Back to Doctors

        </a>

        <h2 class="fw-bold">

            Book Appointment

        </h2>

        <p class="text-muted">

            Select a date and choose an available time slot.

        </p>

    </div>


    <!-- ERROR -->

    <div th:if="${error}"
         class="alert alert-danger">

        <i class="bi bi-exclamation-triangle me-2"></i>

        <span th:text="${error}">
            Error
        </span>

    </div>


    <div class="card">

        <div class="card-body p-4">


            <!-- DOCTOR -->

            <div class="doctor-info mb-4">

                <h5 class="fw-bold"
                    th:text="${'Dr. ' + doctor.user.name}">

                    Doctor Name

                </h5>

                <p class="mb-1 text-muted"
                   th:text="${doctor.specialization}">

                    Specialization

                </p>

                <p class="mb-0 text-muted"
                   th:if="${doctor.department != null}"
                   th:text="${doctor.department.name}">

                    Department

                </p>

            </div>


            <!-- DATE FORM -->

            <form th:action="@{/patient/available-slots}"
                  method="get"
                  class="mb-4">


                <input type="hidden"
                       name="doctorId"
                       th:value="${doctor.id}">


                <div class="row align-items-end">


                    <div class="col-md-8">

                        <label class="form-label fw-semibold">

                            Appointment Date

                        </label>

                        <input type="date"
                               name="date"
                               class="form-control"
                               th:value="${selectedDate}"
                               required>

                    </div>


                    <div class="col-md-4 mt-3 mt-md-0">

                        <button type="submit"
                                class="btn btn-primary w-100">

                            <i class="bi bi-search me-2"></i>

                            Show Available Slots

                        </button>

                    </div>

                </div>

            </form>


            <hr>


            <!-- BOOK FORM -->

            <form th:action="@{/patient/book-appointment}"
                  method="post">


                <input type="hidden"
                       name="doctorId"
                       th:value="${doctor.id}">


                <input type="hidden"
                       name="appointmentDate"
                       th:value="${selectedDate}">


                <!-- AVAILABLE SLOTS -->

                <div class="mb-4">

                    <h5 class="fw-semibold mb-3">

                        Available Time Slots

                    </h5>


                    <!-- SLOTS AVAILABLE -->

                    <div class="row g-3"
                         th:if="${not #lists.isEmpty(availableSlots)}">


                        <div class="col-auto"
                             th:each="slot, stat : ${availableSlots}">


                            <div class="slot-btn">

                                <input type="radio"
                                       th:id="'slot-' + ${stat.index}"
                                       name="appointmentTime"
                                       th:value="${slot}"
                                       required>


                                <label th:for="'slot-' + ${stat.index}"
                                       th:text="${slot}">

                                    09:00

                                </label>

                            </div>

                        </div>

                    </div>


                    <!-- NO SLOTS -->

                    <div class="alert alert-warning"
                         th:if="${#lists.isEmpty(availableSlots)}">

                        <i class="bi bi-calendar-x me-2"></i>

                        No available slots for this date.

                        Please choose another date.

                    </div>

                </div>


                <!-- REASON -->

                <div class="mb-4">

                    <label for="reason"
                           class="form-label fw-semibold">

                        Reason for Visit

                    </label>


                    <textarea id="reason"
                              name="reason"
                              class="form-control"
                              rows="4"
                              placeholder="Briefly describe your reason for consultation...">
                    </textarea>

                </div>


                <!-- BUTTON -->

                <div class="d-flex justify-content-end gap-2">


                    <a th:href="@{/patient/doctors}"
                       class="btn btn-outline-secondary">

                        Cancel

                    </a>


                    <button type="submit"
                            class="btn btn-primary"
                            th:disabled="${#lists.isEmpty(availableSlots)}">

                        <i class="bi bi-calendar-check me-2"></i>

                        Confirm Appointment

                    </button>

                </div>


            </form>

        </div>

    </div>

</div>

</body>

</html>

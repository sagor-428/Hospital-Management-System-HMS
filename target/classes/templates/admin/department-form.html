<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add Department</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h3 class="mb-4">
                        Add Department
                    </h3>


                    <form
                            th:action="@{/admin/departments/save}"
                            th:object="${department}"
                            method="post">


                        <div class="mb-3">

                            <label class="form-label">
                                Department Name
                            </label>

                            <input
                                    type="text"
                                    th:field="*{name}"
                                    class="form-control"
                                    required>

                        </div>


                        <button
                                type="submit"
                                class="btn btn-primary">

                            Save Department

                        </button>


                        <a
                                th:href="@{/admin/departments}"
                                class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>

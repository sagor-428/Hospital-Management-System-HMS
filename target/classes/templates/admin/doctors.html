<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Manage Doctors</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">


<div class="container py-5">


    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">
        <span th:text="${error}">Error message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">

        <h2>
            Doctors
        </h2>

        <a
                th:href="@{/admin/doctors/add}"
                class="btn btn-primary">

            + Add Doctor

        </a>

    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <table class="table table-hover">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Specialization</th>
                    <th>Department</th>
                    <th>Experience</th>
                    <th>Action</th>

                </tr>

                </thead>


                <tbody>

                <tr
                        th:each="doctor : ${doctors}">

                    <td
                            th:text="${doctor.id}">
                        1
                    </td>

                    <td
                            th:text="${doctor.user.name}">
                        Doctor
                    </td>

                    <td
                            th:text="${doctor.user.email}">
                        doctor@gmail.com
                    </td>

                    <td
                            th:text="${doctor.specialization}">
                        Cardiologist
                    </td>

                    <td
                            th:text="${doctor.department.name}">
                        Cardiology
                    </td>

                    <td
                            th:text="${doctor.experience != null ? doctor.experience + ' years' : 'N/A'}">
                        5 years
                    </td>

                    <td>

                        <form
                                th:action="@{/admin/doctors/delete/{id}(id=${doctor.id})}"
                                method="post">

                            <button
                                    type="submit"
                                    class="btn btn-sm btn-danger">

                                Delete

                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>


    <a
            th:href="@{/admin/dashboard}"
            class="btn btn-secondary mt-3">

        ← Dashboard

    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

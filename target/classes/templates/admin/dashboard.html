<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Admin Dashboard</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Hospital Management System
        </span>

        <form th:action="@{/logout}"
              method="post">

            <button class="btn btn-outline-light">
                Logout
            </button>

        </form>

    </div>

</nav>


<div class="container py-5">

    <h2 class="mb-4">
        Admin Dashboard
    </h2>


    <div class="row g-4">


        <!-- Departments -->

        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h5>
                        Departments
                    </h5>

                    <h2
                            th:text="${departmentCount}">
                        0
                    </h2>

                    <a
                            th:href="@{/admin/departments}"
                            class="btn btn-primary">

                        Manage Departments

                    </a>

                </div>

            </div>

        </div>


        <!-- Doctors -->

        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h5>
                        Doctors
                    </h5>

                    <h2
                            th:text="${doctorCount}">
                        0
                    </h2>

                    <a
                            th:href="@{/admin/doctors}"
                            class="btn btn-success">

                        Manage Doctors

                    </a>

                </div>

            </div>

        </div>


        <!-- Patients -->

        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h5>
                        Patients
                    </h5>

                    <h2
                            th:text="${patientCount}">
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>

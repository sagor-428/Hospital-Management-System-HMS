<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add Doctor</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">


<div th:if="${error}"
     class="alert alert-danger"
     role="alert"
     th:text="${error}">
</div>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h3 class="mb-4">
                        Add New Doctor
                    </h3>


                    <form
                            th:action="@{/admin/doctors/save}"
                            th:object="${doctor}"
                            method="post">


                        <!-- Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    required>

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    required>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    required>

                        </div>


                        <!-- Phone -->

                        <div class="mb-3">

                            <label class="form-label">
                                Phone
                            </label>

                            <input
                                    type="text"
                                    name="phone"
                                    class="form-control"
                                    required>

                        </div>


                        <!-- Specialization -->

                        <div class="mb-3">

                            <label class="form-label">
                                Specialization
                            </label>

                            <input
                                    type="text"
                                    th:field="*{specialization}"
                                    class="form-control"
                                    placeholder="e.g. Cardiologist"
                                    required>

                        </div>


                        <!-- Experience -->

                        <div class="mb-3">

                            <label class="form-label">
                                Experience
                            </label>

                            <input
                                    type="number"
                                    th:field="*{experience}"
                                    class="form-control"
                                    min="0"
                                    required>

                        </div>


                        <!-- Qualification -->

                        <div class="mb-3">

                            <label class="form-label">
                                Qualification
                            </label>

                            <input
                                    type="text"
                                    th:field="*{qualification}"
                                    class="form-control"
                                    placeholder="e.g. MBBS, FCPS">

                        </div>


                        <!-- Consultation Fee -->

                        <div class="mb-3">

                            <label class="form-label">
                                Consultation Fee
                            </label>

                            <input
                                    type="number"
                                    step="0.01"
                                    th:field="*{consultationFee}"
                                    class="form-control"
                                    min="0"
                                    placeholder="e.g. 500">

                        </div>


                        <!-- About -->

                        <div class="mb-3">

                            <label class="form-label">
                                About
                            </label>

                            <textarea
                                    th:field="*{about}"
                                    class="form-control"
                                    rows="3"
                                    placeholder="Brief professional bio shown to patients"></textarea>

                        </div>


                        <!-- Department -->

                        <div class="mb-3">

                            <label class="form-label">
                                Department
                            </label>

                            <select
                                    th:field="*{department}"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select Department
                                </option>

                                <option
                                        th:each="department : ${departments}"
                                        th:value="${department.id}"
                                        th:text="${department.name}">

                                </option>

                            </select>

                        </div>


                        <button
                                type="submit"
                                class="btn btn-primary">

                            Create Doctor

                        </button>


                        <a
                                th:href="@{/admin/doctors}"
                                class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Find Doctor</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
        }

        .navbar-brand {
            font-weight: 600;
        }

        .doctor-card {
            transition: 0.2s;
        }

        .doctor-card:hover {
            transform: translateY(-4px);
        }

        .doctor-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #e8f0fe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: auto;
        }

    </style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg bg-primary navbar-dark">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/patient/dashboard}">

            Hospital Management System

        </a>

        <div>

            <a
                    th:href="@{/patient/dashboard}"
                    class="btn btn-light btn-sm">

                Dashboard

            </a>

            <form
                    th:action="@{/logout}"
                    method="post"
                    class="d-inline">

                <button
                        type="submit"
                        class="btn btn-outline-light btn-sm">

                    Logout

                </button>

            </form>

        </div>

    </div>

</nav>


<!-- Main -->

<div class="container py-5">

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">

        <div>

            <h2 class="fw-bold">
                Find a Doctor
            </h2>

            <p class="text-muted mb-0">
                Find the right doctor for your appointment.
            </p>

        </div>

    </div>


    <!-- Search -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <form
                    th:action="@{/patient/doctors}"
                    method="get">

                <div class="row g-3">

                    <!-- Specialization -->

                    <div class="col-md-5">

                        <label class="form-label">
                            Search by specialization
                        </label>

                        <input
                                type="text"
                                name="specialization"
                                th:value="${specialization}"
                                class="form-control"
                                placeholder="e.g. Cardiologist">

                    </div>


                    <!-- Department -->

                    <div class="col-md-5">

                        <label class="form-label">
                            Department
                        </label>

                        <select
                                name="departmentId"
                                class="form-select">

                            <option value="">
                                All Departments
                            </option>

                            <option
                                    th:each="department : ${departments}"
                                    th:value="${department.id}"
                                    th:text="${department.name}"
                                    th:selected="${selectedDepartment == department.id}">

                            </option>

                        </select>

                    </div>


                    <!-- Button -->

                    <div class="col-md-2 d-flex align-items-end">

                        <button
                                type="submit"
                                class="btn btn-primary w-100">

                            Search

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>


    <!-- Doctors -->

    <div class="row g-4">

        <div
                class="col-md-6 col-lg-4"
                th:each="doctor : ${doctors}">

            <div class="card doctor-card
                        shadow-sm h-100">

                <div class="card-body text-center">

                    <div class="doctor-avatar mb-3">

                        👨‍⚕️

                    </div>

                    <h5
                            class="fw-bold"
                            th:text="${'Dr. ' + doctor.user.name}">

                        Dr. Doctor Name

                    </h5>

                    <p
                            class="text-primary mb-1"
                            th:text="${doctor.specialization}">

                        Cardiologist

                    </p>

                    <p
                            class="text-muted"
                            th:text="${doctor.department.name}">

                        Cardiology

                    </p>

                    <a
                            th:href="@{/patient/doctors/{id}(id=${doctor.id})}"
                            class="btn btn-outline-primary">

                        View Profile

                    </a>

                </div>

            </div>

        </div>


        <!-- No doctors -->

        <div
                class="col-12"
                th:if="${#lists.isEmpty(doctors)}">

            <div class="text-center py-5">

                <h5>
                    No doctors found
                </h5>

                <p class="text-muted">
                    Try another specialization or department.
                </p>

            </div>

        </div>

    </div>

</div>

</body>

</html>

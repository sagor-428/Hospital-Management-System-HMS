<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Doctor Details</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a
                class="navbar-brand"
                th:href="@{/patient/dashboard}">

            Hospital Management System

        </a>

        <form
                th:action="@{/logout}"
                method="post">

            <button
                    class="btn btn-light btn-sm">

                Logout

            </button>

        </form>

    </div>

</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <div
                                class="display-4 mb-3">

                            👨‍⚕️

                        </div>

                        <h2
                                th:text="${'Dr. ' + doctor.user.name}">

                            Dr. Doctor Name

                        </h2>

                        <p
                                class="text-primary fs-5"
                                th:text="${doctor.specialization}">

                            Cardiologist

                        </p>

                    </div>


                    <hr>


                    <div class="row mt-4">

                        <div class="col-md-6 mb-3">

                            <strong>
                                Department
                            </strong>

                            <p
                                    th:text="${doctor.department.name}">

                                Cardiology

                            </p>

                        </div>


                        <div class="col-md-6 mb-3">

                            <strong>
                                Phone
                            </strong>

                            <p
                                    th:text="${doctor.user.phone}">

                                01700000000

                            </p>

                        </div>


                        <div class="col-md-6 mb-3">

                            <strong>
                                Email
                            </strong>

                            <p
                                    th:text="${doctor.user.email}">

                                doctor@example.com

                            </p>

                        </div>


                        <div class="col-md-6 mb-3">

                            <strong>
                                Experience
                            </strong>

                            <p
                                    th:text="${doctor.experience != null ? doctor.experience + ' years' : 'N/A'}">

                                10 years

                            </p>

                        </div>

                    </div>


                    <div class="text-center mt-4">

                        <a
                                th:href="@{/patient/doctors}"
                                class="btn btn-outline-secondary me-2">

                            Back

                        </a>

                        <a
                                th:href="@{/patient/book-appointment(doctorId=${doctor.id})}"
                                class="btn btn-primary">

                            Book Appointment

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>

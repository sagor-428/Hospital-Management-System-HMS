<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | Hospital Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background-color: #f5f7fb;
            font-family: "Segoe UI", sans-serif;
        }

        .page-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
        }

        .form-control,
        .form-select {
            min-height: 45px;
            border-radius: 10px;
        }

        .avatar-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #e8f0fe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: auto;
        }

    </style>

</head>

<body>


<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold" th:href="@{/doctor/dashboard}">
            Hospital Management System
        </a>

        <div>

            <a class="btn btn-light btn-sm" th:href="@{/doctor/dashboard}">
                Dashboard
            </a>

            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger btn-sm">Logout</button>
            </form>

        </div>

    </div>

</nav>


<div class="page-container">


    <div class="mb-4 text-center">
        <div class="avatar-circle mb-2">👨‍⚕️</div>
        <h2 class="fw-bold mb-0" th:text="${'Dr. ' + doctor.user.name}">Dr. Name</h2>
        <p class="text-muted" th:text="${doctor.user.email}">doctor@example.com</p>
    </div>


    <!-- SUCCESS -->

    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}">Updated</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>


    <div class="card">

        <div class="card-body p-4">

            <form th:action="@{/doctor/profile}"
                  method="post">

                <h5 class="fw-bold mb-3">Personal Information</h5>

                <div class="row g-3 mb-4">

                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control"
                               th:value="${doctor.user.name}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email (cannot be changed)</label>
                        <input type="email" class="form-control"
                               th:value="${doctor.user.email}" disabled>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-control"
                               th:value="${doctor.user.phone}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">New Password</label>
                        <input type="password" name="newPassword" class="form-control"
                               placeholder="Leave blank to keep current password">
                    </div>

                </div>


                <h5 class="fw-bold mb-3">Professional Information</h5>

                <div class="row g-3 mb-4">

                    <div class="col-md-6">
                        <label class="form-label">Specialization</label>
                        <input type="text" name="specialization" class="form-control"
                               th:value="${doctor.specialization}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Qualification</label>
                        <input type="text" name="qualification" class="form-control"
                               th:value="${doctor.qualification}"
                               placeholder="e.g. MBBS, FCPS">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Experience (years)</label>
                        <input type="number" name="experience" class="form-control"
                               th:value="${doctor.experience}" min="0">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Consultation Fee</label>
                        <input type="number" step="0.01" name="consultationFee" class="form-control"
                               th:value="${doctor.consultationFee}" min="0">
                    </div>

                    <div class="col-12">
                        <label class="form-label">About</label>
                        <textarea name="about" class="form-control" rows="4"
                                  th:text="${doctor.about}"
                                  placeholder="Brief professional bio shown to patients"></textarea>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control"
                               th:value="${doctor.department != null ? doctor.department.name : ''}"
                               disabled>
                        <div class="form-text">Contact an administrator to change your department.</div>
                    </div>

                </div>


                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary btn-lg px-4">
                        <i class="bi bi-check-circle me-2"></i>Save Changes
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>


</body>
</html>

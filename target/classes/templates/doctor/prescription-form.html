<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prescription | Hospital Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background-color: #f5f7fb;
            font-family: "Segoe UI", sans-serif;
        }

        .page-container {
            max-width: 950px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
        }

        .form-control,
        .form-select {
            min-height: 45px;
            border-radius: 10px;
        }

        .info-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 18px 20px;
        }

        .medicine-row {
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            position: relative;
        }

        .remove-row {
            border-radius: 8px;
        }

    </style>

</head>

<body>


<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold" th:href="@{/doctor/dashboard}">
            Hospital Management System
        </a>

        <div>

            <a class="btn btn-light btn-sm" th:href="@{/doctor/appointments}">
                Back to Appointments
            </a>

            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger btn-sm">Logout</button>
            </form>

        </div>

    </div>

</nav>


<div class="page-container">


    <div class="mb-4">
        <h2 class="fw-bold mb-1">
            <span th:if="${prescription.id == null}">Write Prescription</span>
            <span th:if="${prescription.id != null}">Edit Prescription</span>
        </h2>
        <p class="text-muted mb-0">
            Prescription for this patient's appointment.
        </p>
    </div>


    <!-- APPOINTMENT INFO -->

    <div class="info-box mb-4">

        <div class="row">

            <div class="col-md-4">
                <strong>Patient</strong>
                <p class="mb-0 text-muted" th:text="${appointment.patient.user.name}">
                    Patient Name
                </p>
            </div>

            <div class="col-md-4">
                <strong>Date</strong>
                <p class="mb-0 text-muted" th:text="${appointment.appointmentDate}">
                    2026-08-30
                </p>
            </div>

            <div class="col-md-4">
                <strong>Time</strong>
                <p class="mb-0 text-muted" th:text="${appointment.appointmentTime}">
                    10:00
                </p>
            </div>

        </div>

    </div>


    <div class="card">

        <div class="card-body p-4">

            <form th:action="@{/doctor/appointments/{id}/prescription(id=${appointment.id})}"
                  method="post"
                  id="prescriptionForm">


                <!-- DIAGNOSIS -->

                <div class="mb-3">
                    <label class="form-label">Diagnosis</label>
                    <textarea name="diagnosis" class="form-control" rows="2"
                              th:text="${prescription.diagnosis}"
                              placeholder="e.g. Acute viral fever"
                              required></textarea>
                </div>


                <!-- NOTES -->

                <div class="mb-4">
                    <label class="form-label">Notes</label>
                    <textarea name="notes" class="form-control" rows="2"
                              th:text="${prescription.notes}"
                              placeholder="Any additional advice for the patient"></textarea>
                </div>


                <!-- MEDICINES -->

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Medicines</h5>
                    <button type="button"
                            class="btn btn-outline-primary btn-sm"
                            id="addMedicineBtn">
                        <i class="bi bi-plus-circle me-1"></i>Add Medicine
                    </button>
                </div>

                <div id="medicineRows">

                    <div class="medicine-row"
                         th:each="medicine : ${prescription.medicines}">

                        <div class="row g-2">

                            <div class="col-md-3">
                                <label class="form-label">Medicine Name</label>
                                <input type="text" name="medicineName" class="form-control"
                                       th:value="${medicine.medicineName}" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Dosage</label>
                                <input type="text" name="dosage" class="form-control"
                                       th:value="${medicine.dosage}"
                                       placeholder="e.g. 1 tablet twice daily">
                            </div>

                            <div class="col-md-2">
                                <label class="form-label">Duration</label>
                                <input type="text" name="duration" class="form-control"
                                       th:value="${medicine.duration}"
                                       placeholder="e.g. 5 days">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Instructions</label>
                                <input type="text" name="instructions" class="form-control"
                                       th:value="${medicine.instructions}"
                                       placeholder="e.g. After meals">
                            </div>

                            <div class="col-md-1 d-flex align-items-end">
                                <button type="button"
                                        class="btn btn-outline-danger remove-row w-100"
                                        onclick="this.closest('.medicine-row').remove()">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>

                        </div>

                    </div>

                </div>


                <!-- HIDDEN TEMPLATE ROW (cloned by JS) -->

                <template id="medicineRowTemplate">
                    <div class="medicine-row">
                        <div class="row g-2">

                            <div class="col-md-3">
                                <label class="form-label">Medicine Name</label>
                                <input type="text" name="medicineName" class="form-control" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Dosage</label>
                                <input type="text" name="dosage" class="form-control"
                                       placeholder="e.g. 1 tablet twice daily">
                            </div>

                            <div class="col-md-2">
                                <label class="form-label">Duration</label>
                                <input type="text" name="duration" class="form-control"
                                       placeholder="e.g. 5 days">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Instructions</label>
                                <input type="text" name="instructions" class="form-control"
                                       placeholder="e.g. After meals">
                            </div>

                            <div class="col-md-1 d-flex align-items-end">
                                <button type="button"
                                        class="btn btn-outline-danger remove-row w-100"
                                        onclick="this.closest('.medicine-row').remove()">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>

                        </div>
                    </div>
                </template>


                <div id="noMedicineHint"
                     class="text-muted small mb-3"
                     th:if="${#lists.isEmpty(prescription.medicines)}">
                    No medicines added yet. Click "Add Medicine" to add one.
                </div>


                <div class="d-flex justify-content-end gap-2 mt-4">

                    <a th:href="@{/doctor/appointments}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-check-circle me-2"></i>Save Prescription
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<script>

    document.getElementById('addMedicineBtn').addEventListener('click', function () {

        var template = document.getElementById('medicineRowTemplate');
        var clone = template.content.cloneNode(true);

        document.getElementById('medicineRows').appendChild(clone);

        var hint = document.getElementById('noMedicineHint');
        if (hint) {
            hint.style.display = 'none';
        }

    });

    document.getElementById('prescriptionForm').addEventListener('submit', function (e) {

        var rows = document.querySelectorAll('#medicineRows .medicine-row');

        if (rows.length === 0) {
            e.preventDefault();
            alert('Please add at least one medicine before saving.');
        }

    });

</script>


</body>
</html>

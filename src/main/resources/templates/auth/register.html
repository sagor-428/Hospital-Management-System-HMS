<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Patient Registration</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Patient Registration
                    </h2>

                    <form
                            th:action="@{/register}"
                            th:object="${registrationRequest}"
                            method="post">

                        <!-- Name -->
                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                    type="text"
                                    th:field="*{name}"
                                    class="form-control">

                            <div
                                    th:if="${#fields.hasErrors('name')}"
                                    th:errors="*{name}"
                                    class="text-danger">
                            </div>

                        </div>

                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                    type="email"
                                    th:field="*{email}"
                                    class="form-control">

                            <div
                                    th:if="${#fields.hasErrors('email')}"
                                    th:errors="*{email}"
                                    class="text-danger">
                            </div>

                        </div>

                        <!-- Password -->
                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                    type="password"
                                    th:field="*{password}"
                                    class="form-control">

                            <div
                                    th:if="${#fields.hasErrors('password')}"
                                    th:errors="*{password}"
                                    class="text-danger">
                            </div>

                        </div>

                        <!-- Phone -->
                        <div class="mb-3">

                            <label class="form-label">
                                Phone
                            </label>

                            <input
                                    type="text"
                                    th:field="*{phone}"
                                    class="form-control">

                        </div>

                        <!-- Date of Birth -->
                        <div class="mb-3">

                            <label class="form-label">
                                Date of Birth
                            </label>

                            <input
                                    type="date"
                                    th:field="*{dateOfBirth}"
                                    class="form-control">

                        </div>

                        <!-- Gender -->
                        <div class="mb-3">

                            <label class="form-label">
                                Gender
                            </label>

                            <select
                                    th:field="*{gender}"
                                    class="form-select">

                                <option value="">
                                    Select Gender
                                </option>

                                <option value="MALE">
                                    Male
                                </option>

                                <option value="FEMALE">
                                    Female
                                </option>

                                <option value="OTHER">
                                    Other
                                </option>

                            </select>

                        </div>

                        <!-- Blood Group -->
                        <div class="mb-3">

                            <label class="form-label">
                                Blood Group
                            </label>

                            <input
                                    type="text"
                                    th:field="*{bloodGroup}"
                                    class="form-control"
                                    placeholder="e.g. A+">

                        </div>

                        <!-- Address -->
                        <div class="mb-3">

                            <label class="form-label">
                                Address
                            </label>

                            <textarea
                                    th:field="*{address}"
                                    class="form-control"
                                    rows="3">
                            </textarea>

                        </div>

                        <button
                                type="submit"
                                class="btn btn-primary w-100">

                            Create Account

                        </button>

                    </form>

                    <div class="text-center mt-3">

                        Already have an account?

                        <a th:href="@{/login}">
                            Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>

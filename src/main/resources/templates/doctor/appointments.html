<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Appointments</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">


<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/doctor/dashboard}">
            Hospital Management System
        </a>

        <div>

            <a class="btn btn-light btn-sm"
               th:href="@{/doctor/dashboard}">
                Dashboard
            </a>

            <a class="btn btn-light btn-sm"
               th:href="@{/doctor/schedule}">
                Schedule
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  class="d-inline">

                <button
                        type="submit"
                        class="btn btn-danger btn-sm">
                    Logout
                </button>

            </form>

        </div>

    </div>

</nav>


<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2>My Appointments</h2>

            <p class="text-muted mb-0">
                Manage your patient appointments
            </p>

        </div>

    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">

                    <tr>

                        <th>#</th>

                        <th>Patient</th>

                        <th>Date</th>

                        <th>Time</th>

                        <th>Reason</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="appointment, stat : ${appointments}">

                        <td th:text="${stat.count}">
                            1
                        </td>


                        <td>

                            <strong
                                    th:text="${appointment.patient.user.name}">
                                Patient Name
                            </strong>

                        </td>


                        <td
                                th:text="${appointment.appointmentDate}">
                            2026-08-29
                        </td>


                        <td
                                th:text="${appointment.appointmentTime}">
                            10:00
                        </td>


                        <td
                                th:text="${appointment.reason}">
                            Checkup
                        </td>


                        <td>

                            <span
                                    class="badge bg-warning text-dark"
                                    th:if="${appointment.status.name() == 'PENDING'}">
                                Pending
                            </span>

                            <span
                                    class="badge bg-success"
                                    th:if="${appointment.status.name() == 'CONFIRMED'}">
                                Confirmed
                            </span>

                            <span
                                    class="badge bg-primary"
                                    th:if="${appointment.status.name() == 'COMPLETED'}">
                                Completed
                            </span>

                            <span
                                    class="badge bg-danger"
                                    th:if="${appointment.status.name() == 'REJECTED'}">
                                Rejected
                            </span>

                            <span
                                    class="badge bg-secondary"
                                    th:if="${appointment.status.name() == 'CANCELLED'}">
                                Cancelled
                            </span>

                        </td>


                        <td>

                            <!-- Pending -->

                            <div
                                    th:if="${appointment.status.name() == 'PENDING'}">

                                <form
                                        th:action="@{/doctor/appointments/{id}/status(id=${appointment.id})}"
                                        method="post"
                                        class="d-inline">

                                    <input
                                            type="hidden"
                                            name="status"
                                            value="CONFIRMED">

                                    <button
                                            type="submit"
                                            class="btn btn-success btn-sm">
                                        Accept
                                    </button>

                                </form>


                                <form
                                        th:action="@{/doctor/appointments/{id}/status(id=${appointment.id})}"
                                        method="post"
                                        class="d-inline">

                                    <input
                                            type="hidden"
                                            name="status"
                                            value="REJECTED">

                                    <button
                                            type="submit"
                                            class="btn btn-danger btn-sm">
                                        Reject
                                    </button>

                                </form>

                            </div>


                            <!-- Accepted -->

                            <div
                                    th:if="${appointment.status.name() == 'CONFIRMED'}">

                                <form
                                        th:action="@{/doctor/appointments/{id}/status(id=${appointment.id})}"
                                        method="post">

                                    <input
                                            type="hidden"
                                            name="status"
                                            value="COMPLETED">

                                    <button
                                            type="submit"
                                            class="btn btn-primary btn-sm">
                                        Mark Completed
                                    </button>

                                </form>

                            </div>


                            <!-- Completed: prescription -->

                            <a
                                    th:if="${appointment.status.name() == 'COMPLETED'}"
                                    th:href="@{/doctor/appointments/{id}/prescription(id=${appointment.id})}"
                                    class="btn btn-outline-primary btn-sm">
                                Prescription
                            </a>


                            <!-- Rejected / Cancelled -->

                            <span
                                    th:if="${appointment.status.name() == 'REJECTED'
                                    or appointment.status.name() == 'CANCELLED'}"
                                    class="text-muted">

                                No Action

                            </span>

                        </td>

                    </tr>


                    <!-- Empty -->

                    <tr th:if="${#lists.isEmpty(appointments)}">

                        <td
                                colspan="7"
                                class="text-center text-muted py-4">

                            No appointments found.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


</body>
</html>
